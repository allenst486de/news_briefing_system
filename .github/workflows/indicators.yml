name: Refresh Market Indicators

# 지표만 갱신하는 가벼운 워크플로 (뉴스/LLM/텔레그램 없음).
# GitHub Pages는 정적 호스팅이고 Naver 지표 API는 CORS를 허용하지 않아
# 브라우저에서 직접 부를 수 없다 — 같은 도메인의 indicators.json을 주기적으로
# 갱신해두고 site.js가 그걸 읽는 방식으로 장중 갱신을 구현한다.
on:
  schedule:
    # 한국 시간 평일 09~16시 15분 간격 = UTC 00~07시 (KST = UTC+9)
    - cron: '*/15 0-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 15분 간격이라 앞 실행이 밀리면 겹칠 수 있다 — 최신 것만 남긴다
  group: refresh-indicators
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml yfinance

      - name: Refresh indicators.json
        run: python update_indicators.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -z $(git status --porcelain docs/indicators.json) ]]; then
            echo "No indicator change"
            exit 0
          fi

          git add docs/indicators.json
          git commit -m "chore: refresh market indicators"

          # 일일 브리핑 실행과 겹치면 non-fast-forward가 나므로 rebase 후 재시도
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
