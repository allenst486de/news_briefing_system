name: Daily News Briefing

on:
  schedule:
    # 한국 시간 오전 6시 = UTC 전날 21시 (KST = UTC+9)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    # 코드 쪽 예산(본문 300초 + LLM 900초)으로 25분 안에 끝나게 잡아뒀지만,
    # 외부 API가 느린 날 여유가 없으면 통째로 취소된다 — 실제로 30분에 걸려
    # 두 번 취소됐다. 공개 저장소는 Actions 시간이 무료라 여유를 둔다.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "PAGES_BASE_URL=${{ secrets.PAGES_BASE_URL }}" >> .env
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" >> .env
      
      - name: Run news briefing
        run: python main.py
      
      - name: Commit docs/data/archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # archive/는 90일 롤오버가 아직 한 번도 안 일어났으면 존재하지 않음 —
          # 없는 경로에 git add/status를 하면 fatal error가 나므로 미리 만들어둠
          mkdir -p docs data archive

          if [[ -z $(git status --porcelain docs/ data/ archive/) ]]; then
            echo "No changes in docs/data/archive"
            exit 0
          fi

          git add docs/ data/ archive/
          git commit -m "Update daily news briefing - $(date +'%Y-%m-%d')"

          # 브리핑 생성이 수 분~수십 분 걸려서 그 사이 main에 다른 push가 들어오면
          # 여기 push가 non-fast-forward로 거절된다(실제 실패 원인). rebase 후 재시도.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          exit 1
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
