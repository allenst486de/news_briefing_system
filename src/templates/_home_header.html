{# 홈 상단 헤더 — 날짜(서버 렌더) + 시계/날씨(site.js가 방문 시점에 채움) + 경제지표 티커 #}
<header class="home-header">
    <div class="home-title-row">
        <h1>📰 일일 뉴스 브리핑</h1>
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="라이트/다크 모드 전환">🌓</button>
    </div>

    <div class="home-datetime">
        <span id="live-clock">--:--:--</span>
        <span class="home-date">📅 {{ date }}</span>
        <span class="home-weather" id="weather-widget" data-loading="true">날씨 확인 중…</span>
    </div>

    {% include '_indicator_box.html' %}
</header>
