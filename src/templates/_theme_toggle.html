{# 라이트/다크 전환 스위치 — 예전엔 🌓 이모지 버튼이라 무슨 기능인지 알기 어려웠다 #}
<button type="button" id="theme-toggle" class="theme-switch" role="switch"
        aria-checked="false" aria-label="다크 모드 전환">
    <span class="theme-switch-track" aria-hidden="true">
        <span class="theme-switch-icon theme-switch-icon-sun">☀</span>
        <span class="theme-switch-icon theme-switch-icon-moon">☾</span>
        <span class="theme-switch-thumb"></span>
    </span>
</button>
